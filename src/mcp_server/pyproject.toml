[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emv-mcp-as"
version = "0.1.0"
description = "Autodesk Advance Steel MCP Server for AI-driven structural detailing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "EMV Community" }
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0"
]

[project.scripts]
emv-mcp-as = "mcp_server.server:main"

[tool.setuptools.packages.find]
where = ["src"]
